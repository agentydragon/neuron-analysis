[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "neuron-analysis"
version = "0.1.0"
description = "Pixel masks, rendering, and evaluation for microscopy neuron tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=17.0.1",
    "pillow>=12.0",
    "pydantic>=2.13.5",
]

[project.scripts]
neuron-render = "neuron_tracking.render:main"
neuron-check = "neuron_tracking.check:main"
neuron-eval-frames = "neuron_tracking.eval_frames:main"
neuron-identity = "neuron_tracking.identity:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25",
    "pytest>=9.1.1",
]
evals = [
    "inspect-ai>=0.3.282",
    "inspect-swe>=0.2.72",
]

[tool.hatch.build.targets.wheel]
packages = ["neuron_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
