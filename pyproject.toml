[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cell-analysis"
version = "0.1.0"
description = "Pixel masks, rendering, and evaluation for microscopy cell tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "av>=17.0.1",
    "pillow>=12.0",
    "pydantic>=2.13.5",
]

[project.scripts]
cell-render = "cell_tracking.render:main"
cell-views = "cell_tracking.views:main"
cell-eval-frames = "cell_tracking.eval_frames:main"
cell-identity = "cell_tracking.identity:main"

[dependency-groups]
agent = [
    "imageio>=2.38.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
]
dev = [
    "jsonschema>=4.25",
    "pytest>=9.1.1",
]
evals = [
    "anthropic>=1.16.0",
    "inspect-ai>=0.3.282",
    "inspect-swe>=0.2.72",
    "jsonschema>=4.26.0",
    "zipfile-zstd>=0.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["cell_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
